spring:
  datasource:
    url: jdbc:h2:mem:emsidrive;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: emsidrive-test-secret-key-with-at-least-32-bytes
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    student-email-domains: emsi-edu.ma

logging:
  level:
    root: WARN
    ma.emsi.emsidrive: INFO
