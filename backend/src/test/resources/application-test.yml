spring:
  datasource:
    url: jdbc:h2:mem:emsidrive;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    ma.emsi.emsidrive: INFO
