spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/emsidrive}
    username: ${DB_USERNAME:emsidrive}
    password: ${DB_PASSWORD:emsidrive}

  # Mailpit from docker-compose.yml catches the emails (web inbox on port 8025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    ma.emsi.emsidrive: DEBUG
