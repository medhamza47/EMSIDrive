name: emsidrive-ocr
services:
  paddleocr:
    build: .
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - model-weights:/models:ro
      - models:/root/.paddlex
      - huggingface:/root/.cache/huggingface
    shm_size: 2gb
    restart: unless-stopped
volumes:
  models:
  huggingface:
  model-weights:
    external: true
    name: emsidrive-paddle-model
